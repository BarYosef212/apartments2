<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>פרסום בקבוצות</title>
<style>
  body { margin: 0; width: 280px; font: 14px/1.5 system-ui, sans-serif; color: #191917; background: #F4F1EB; }
  main { padding: 16px; display: grid; gap: 12px; }
  h1 { margin: 0; font-size: 17px; }
  .stat { background: #fff; padding: 10px 12px; }
  .stat b { font-size: 20px; }
  label { display: grid; gap: 4px; font-weight: 500; }
  input { height: 36px; border: 1px solid #D9D2C6; padding: 0 8px; font: inherit; }
  button { height: 40px; border: 0; background: #191917; color: #fff; font: 600 14px system-ui, sans-serif; cursor: pointer; }
  button.secondary { background: transparent; color: #191917; border: 1px solid #191917; }
  .warn { background: #fee2e2; color: #7f1d1d; padding: 8px 10px; }
  .muted { color: #625D55; font-size: 12px; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>פרסום בקבוצות</h1>
  <div class="stat">היום: <b id="count">0</b> מתוך <span id="cap">-</span> קבוצות</div>
  <div class="stat" id="next">אפשר לפרסם עכשיו</div>
  <div class="warn" id="paused" hidden>
    הפרסום מושהה עד <span id="pausedUntil"></span> בגלל אזהרה מפייסבוק.
    <button class="secondary" id="resume" style="margin-top:8px;width:100%">חידוש עכשיו</button>
  </div>
  <div class="warn" id="devBadge" hidden>מצב פיתוח פעיל: אין המתנה ואין מכסה יומית. בטלו לפני פרסום אמיתי.</div>
  <form id="form">
    <label style="display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:10px">
      <input id="devMode" type="checkbox" style="width:18px;height:18px">
      מצב פיתוח (בלי המתנה ובלי מכסה)
    </label>
    <label>מקסימום קבוצות ביום (עד 25)
      <input id="dailyCap" type="number" min="1" max="25" required>
    </label>
    <label style="margin-top:8px">דקות לפחות בין קבוצה לקבוצה (5 ומעלה)
      <input id="minGap" type="number" min="5" max="120" required>
    </label>
    <button type="submit" style="margin-top:12px;width:100%">שמירה</button>
  </form>
  <p class="muted">לכל המתנה נוספים עוד עד 5 דקות אקראיות, כדי שהפרסום לא ייראה כמו מכונה.</p>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
